
{% load static %}

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Створити заявку</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="profile-container">

    <h1>Нова заявка</h1>

    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Створити заявку</button>
    </form>

    <a href="{% url 'ticket_list' %}">Назад до заявок</a>

</div>

</body>
</html>
